name: expand-about
on:
  push:
    branches: [feat/single-about-source]
    paths:
      - '.github/workflows/expand-about.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/single-about-source
      - name: Expand About section in index.html
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old_css = """    /* ---------- About / skills ---------- */\n    .about { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); }\n    .panel { padding: 1.5rem; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }\n    .panel h3 { font-size: 1rem; margin-block-end: .75rem; }\n    .chips { display: flex; flex-wrap: wrap; gap: .45rem; padding: 0; margin: 0; list-style: none; }\n    .chips li { padding: .35rem .7rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: .88rem; }\n"""
          extra_css = old_css + """    .metrics { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); margin-block: 1.5rem; }\n    .metric { padding: 1.1rem 1.2rem; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }\n    .metric strong { display: block; font-size: 1.35rem; letter-spacing: -.02em; }\n    .metric span { display: block; margin-block-start: .25rem; color: var(--muted); font-size: .88rem; }\n    .jobs { display: grid; gap: 1rem; margin-block-start: 1.5rem; }\n    .job h3 { font-size: 1.05rem; margin: 0 0 .2rem; }\n    .job .meta { color: var(--muted); font-size: .9rem; margin: 0 0 .6rem; }\n    .job ul { margin: 0; padding-inline-start: 1.15rem; }\n    .job li { margin-block: .25rem; }\n    .certs { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); margin-block-start: 1rem; }\n    .certs p { margin: 0; color: var(--muted); font-size: .9rem; }\n    .certs strong { display: block; color: var(--text); }\n    .about-contact { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; margin-block-start: 1rem; }\n"""
          marker = '<!-- About -->'
          end = '  </main>'
          if marker not in text:
              raise SystemExit('about marker missing')
          if old_css not in text:
              raise SystemExit('css missing')
          start = text.index(marker)
          stop = text.index(end, start)
          new_about = Path('about-section.inc.html').read_text() if Path('about-section.inc.html').exists() else ''
          if not new_about:
              raise SystemExit('include missing')
          text = text.replace(old_css, extra_css, 1)
          text = text[:start] + new_about + text[stop:]
          p.write_text(text)
          print('patched', p.stat().st_size)
          PY
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Expand homepage #about with experience, certs, and contact."
          git push
