name: expand-about
on:
  push:
    branches: [feat/single-about-source]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Expand homepage #about with experience, certs, and contact.'
    steps:
      - uses: actions/checkout@v4
      - name: Expand About section in index.html
        run: |
          python3 << 'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          inc = Path('about-section.inc.html').read_text()
          css_anchor = "    .chips li { padding: .35rem .7rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: .88rem; }\n"
          extra = css_anchor + """    .metrics { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); margin-block: 1.5rem; }
    .metric { padding: 1.1rem 1.2rem; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
    .metric strong { display: block; font-size: 1.35rem; letter-spacing: -.02em; }
    .metric span { display: block; margin-block-start: .25rem; color: var(--muted); font-size: .88rem; }
    .jobs { display: grid; gap: 1rem; margin-block-start: 1.5rem; }
    .job h3 { font-size: 1.05rem; margin: 0 0 .2rem; }
    .job .meta { color: var(--muted); font-size: .9rem; margin: 0 0 .6rem; }
    .job ul { margin: 0; padding-inline-start: 1.15rem; }
    .job li { margin-block: .25rem; }
    .certs { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); margin-block-start: 1rem; }
    .certs p { margin: 0; color: var(--muted); font-size: .9rem; }
    .certs strong { display: block; color: var(--text); }
    .about-contact { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; margin-block-start: 1rem; }
"""
          if css_anchor not in text:
              raise SystemExit('css anchor missing')
          if 'id="about"' not in text:
              raise SystemExit('about missing')
          start = text.index('    <!-- About')
          stop = text.index('  </main>', start)
          text = text.replace(css_anchor, extra, 1)
          start = text.index('    <!-- About')
          stop = text.index('  </main>', start)
          text = text[:start] + inc + text[stop:]
          Path('index.html').write_text(text)
          print('patched', Path('index.html').stat().st_size)
          PY
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Expand homepage #about with experience, certs, and contact."
          git push
