name: fix-about-boundary
on:
  push:
    branches: [fix/about-section-boundary]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Close project cards') }}
    steps:
      - uses: actions/checkout@v4
      - name: Close project cards before About
        run: python3 scripts/fix_about_boundary.py
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "Close project cards so About is its own section."
          git push
